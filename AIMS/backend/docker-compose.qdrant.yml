# Qdrant — the vector store behind the assistant's documentation search.
#
# Run it with:
#   docker compose -f docker-compose.qdrant.yml up -d
#
# Then populate it:
#   node src/scripts/ingest_knowledge_base.js
#
# The assistant degrades gracefully when this is not running: the vector store
# module fails to load, search_aims_knowledge reports that documentation is
# unavailable, and every database tool carries on working. An absent container
# costs one tool, not the assistant.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aims-qdrant
    restart: unless-stopped

    ports:
      # 6333 REST (what the Node client uses), 6334 gRPC.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      # Named volume rather than a bind mount: Qdrant's storage layout is its
      # own business, and a bind mount on Windows adds a filesystem translation
      # layer that has caused corruption reports.
      - qdrant_storage:/qdrant/storage

    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO

    healthcheck:
      # Qdrant's image is distroless-ish and has no curl or wget, so the check
      # uses its own binary rather than a shell tool that is not there.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qdrant_storage:
